plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'com.diffplug.spotless' version '6.25.0'
}

group = 'team.cappcraft.immcheme'

base {
    archivesName = 'ImmChemE'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

def versionReplacements = [
    version        : project.version,
    mc_version     : version_minecraft,
    forge_version  : version_forge,
    kubejs_version : version_kubejs,
    mod_license    : mod_license,
    mod_name       : mod_name,
    mod_authors    : mod_authors,
    mod_description: mod_description,
    version_ie     : version_ie,
    mod_id         : mod_id
]

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += '-Xlint:deprecation'
}

tasks.withType(ProcessResources).configureEach {
    inputs.properties versionReplacements
    filesMatching('META-INF/mods.toml') {
        expand versionReplacements
    }
}

minecraft {
    mappings channel: 'official', version: version_minecraft

    runs {
        client {
            workingDirectory project.file('run')
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                immersivechemical { source sourceSets.main }
            }
        }
    }
}

repositories {
    mavenCentral()
    maven { url 'https://maven.blamejared.com/' }
    maven { url 'https://maven.architectury.dev/' }
    maven {
        url 'https://maven.latvian.dev/releases'
        content { includeGroup 'dev.latvian.mods' }
    }
    maven { url 'https://www.cursemaven.com' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${version_minecraft}-${version_forge}"

    implementation fg.deobf("curse.maven:immersive-engineering-231951:6206989")

    compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge-api:${version_jei}")
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-common-api:${version_jei}")
    compileOnly fg.deobf("dev.latvian.mods:kubejs-forge:${version_kubejs}")

    runtimeOnly fg.deobf("mezz.jei:jei-1.20.1-forge:${version_jei}")
    runtimeOnly fg.deobf("dev.latvian.mods:kubejs-forge:${version_kubejs}")
    runtimeOnly fg.deobf("dev.latvian.mods:rhino-forge:${version_rhino}")
    runtimeOnly fg.deobf("dev.architectury:architectury-forge:${version_architectury}")
}

spotless {
    java {
        googleJavaFormat('1.22.0').aosp()
        target 'src/main/java/**/*.java'
    }
}
