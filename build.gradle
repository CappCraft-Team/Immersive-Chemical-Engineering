import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.parchmentmc.librarian.forgegradle' version '1.2.0.7-dev-SNAPSHOT'
    id 'eclipse'
    id 'idea'
}

group = 'team.cappcraft.icheme'

base {
    archivesName = 'IChemE'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// ----------------------------------------------------------------------------
// RESOURCE EXPANSION & REPLACEMENTS
// ----------------------------------------------------------------------------

def versionReplacements = [
    version        : project.version,
    mc_version     : version_minecraft,
    forge_version  : version_forge,
    kubejs_version : version_kubejs,
    mod_license    : mod_license,
    mod_name       : mod_name,
    mod_authors    : mod_authors,
    mod_description: mod_description,
    version_ie     : version_ie,
    mod_id         : mod_id
]

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.FAIL
    inputs.properties versionReplacements

    filesMatching('META-INF/mods.toml') {
        expand versionReplacements
    }
    exclude '.cache'

    doLast {
        def slurper = new JsonSlurper()
        fileTree(dir: outputs.files.asPath, include: ['**/*.json', '**/*.mcmeta']).each { File f ->
            try {
                def parsed = slurper.parse(f)
                f.text = JsonOutput.prettyPrint(JsonOutput.toJson(parsed))
            } catch (Exception e) {
                logger.warn("Skipping invalid JSON file ${f.name}: ${e.message}")
            }
        }
    }
}

tasks.withType(Jar).configureEach {
    zip64 = true
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
        rename { 'LICENSE_immersivechemical' }
    }
}

// ----------------------------------------------------------------------------
// FORGE RUNS & DEPENDENCIES
// ----------------------------------------------------------------------------

minecraft {
    mappings channel: 'parchment', version: "1.19.3-2023.06.25-1.20.1"

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            ideaModule "${project.name}.main"
            mods {
                immersivechemical { source sourceSets.main }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            arg '-nogui'
            mods {
                immersivechemical { source sourceSets.main }
            }
        }
    }
}

repositories {
    mavenCentral()
    maven { url 'https://maven.blamejared.com/' }
    maven { url 'https://maven.architectury.dev/' }
    maven {
        url 'https://maven.latvian.dev/releases'
        content { includeGroup 'dev.latvian.mods' }
    }
    maven { url 'https://www.cursemaven.com' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${version_minecraft}-${version_forge}"
    implementation fg.deobf("curse.maven:immersive-engineering-231951:6206989")
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge-api:${version_jei}")
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-common-api:${version_jei}")
    runtimeOnly fg.deobf("mezz.jei:jei-1.20.1-forge:${version_jei}")
    compileOnly fg.deobf("dev.latvian.mods:kubejs-forge:${version_kubejs}")
    if (providers.gradleProperty('enableKubeJsRun').map(String::toBoolean).getOrElse(false)) {
        runtimeOnly fg.deobf("dev.latvian.mods:kubejs-forge:${version_kubejs}")
        runtimeOnly fg.deobf("dev.latvian.mods:rhino-forge:${version_rhino}")
        runtimeOnly fg.deobf("dev.architectury:architectury-forge:${version_architectury}")
    }
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
}

// ----------------------------------------------------------------------------
// EXTRA TASKS
// ----------------------------------------------------------------------------

tasks.register('sourcesJar', Jar) {
    dependsOn tasks.classes
    archiveClassifier.set('sources')
    from sourceSets.main.allSource
}

artifacts {
    archives tasks.named('sourcesJar')
}

tasks.named('test') {
    useJUnitPlatform()
}
